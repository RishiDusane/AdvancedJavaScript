<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calc.css">
    <title>Simple Calculator</title>
</head>
<body>
    <main class="calculator" aria-label="Simple calculator">
        <header class="calculator__header">
            <p class="eyebrow">Academic project</p>
            <h1>Simple Calculator</h1>
        </header>

        <section class="display" aria-live="polite">
            <p class="display__previous" id="previous-display"></p>
            <output class="display__current" id="current-display">0</output>
        </section>

        <section class="keypad" aria-label="Calculator keypad">
            <button class="key key--utility" data-action="clear" type="button">AC</button>
            <button class="key key--utility" data-action="delete" type="button" aria-label="Delete last digit">DEL</button>
            <button class="key key--operator" data-operation="%" type="button">%</button>
            <button class="key key--operator" data-operation="÷" type="button">÷</button>

            <button class="key" data-number="7" type="button">7</button>
            <button class="key" data-number="8" type="button">8</button>
            <button class="key" data-number="9" type="button">9</button>
            <button class="key key--operator" data-operation="×" type="button">×</button>

            <button class="key" data-number="4" type="button">4</button>
            <button class="key" data-number="5" type="button">5</button>
            <button class="key" data-number="6" type="button">6</button>
            <button class="key key--operator" data-operation="−" type="button">−</button>

            <button class="key" data-number="1" type="button">1</button>
            <button class="key" data-number="2" type="button">2</button>
            <button class="key" data-number="3" type="button">3</button>
            <button class="key key--operator" data-operation="+" type="button">+</button>

            <button class="key key--zero" data-number="0" type="button">0</button>
            <button class="key" data-number="." type="button">.</button>
            <button class="key key--equals" data-action="equals" type="button">=</button>
        </section>

        <p class="hint">Use the keyboard or click the buttons</p>
    </main>

    <script src="calc.js"></script>
</body>
</html>
